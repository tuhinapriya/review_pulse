[project]
name = "review-pulse-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",

    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pydantic[email]>=2.7.0",

    # Async task queue
    "celery[redis]>=5.4.0",

    # LLM providers — we use the SDKs directly, no LangChain
    "openai>=1.35.0",         # also used for DeepSeek (OpenAI-compatible API)
    "anthropic>=0.30.0",

    # HTTP client (webhook delivery, Supabase auth calls)
    "httpx>=0.27.0",

    # Resilience: retry with exponential backoff for LLM rate limits
    "tenacity>=8.3.0",

    # Structured logging — JSON in prod, pretty in dev (N4)
    "structlog>=24.2.0",

    # JWT validation for Supabase tokens
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "factory-boy>=3.3.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# T201 = no print() — enforce structured logging everywhere
extend-select = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
