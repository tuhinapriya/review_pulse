services:
  # Free-demo topology: run FastAPI, Celery worker, and Celery beat in one
  # Render web service. For production, split worker/beat into separate services.
  - type: web
    name: review-pulse-api
    env: python
    plan: free
    buildCommand: cd backend && pip install uv && uv sync --all-extras --frozen
    startCommand: cd backend && uv run alembic upgrade head && uv run celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1 & uv run celery -A app.tasks.celery_app beat --loglevel=info & uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: review-pulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: review-pulse-redis
          property: connectionString
      - fromGroup: review-pulse-secrets

  # Redis-compatible broker/result backend for Celery.
  - type: redis
    name: review-pulse-redis
    plan: free
    ipAllowList: []

databases:
  # Free Render Postgres is fine for a review/demo link, but expires after
  # 30 days. Use Supabase/Neon/paid Postgres for anything longer-lived.
  - name: review-pulse-db
    plan: free
    databaseName: reviewpulse
    user: reviewpulse

envVarGroups:
  - name: review-pulse-secrets
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: USE_SUPABASE_ADMIN_SIGNUP
        value: "true"
      - key: LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMBEDDING_DIM
        value: "1024"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:5173
